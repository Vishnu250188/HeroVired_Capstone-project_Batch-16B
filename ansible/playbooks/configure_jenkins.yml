
---
- name: Validate DevOps CI/CD tools on Jenkins agent
  hosts: local
  connection: local
  become: false

  tasks:
    - name: Check Ansible version
      ansible.builtin.command:
        cmd: ansible --version
      register: ansible_check
      changed_when: false

    - name: Check Git version
      ansible.builtin.command:
        cmd: git --version
      register: git_check
      changed_when: false

    - name: Check Docker availability
      ansible.builtin.command:
        cmd: docker --version
      register: docker_check
      changed_when: false
      failed_when: false

    - name: Check AWS CLI availability
      ansible.builtin.command:
        cmd: aws --version
      register: aws_check
      changed_when: false
      failed_when: false

    - name: Display tool verification results
      ansible.builtin.debug:
        msg:
          - "{{ ansible_check.stdout_lines[0] }}"
          - "{{ git_check.stdout }}"
          - "Docker: {{ docker_check.stdout | default('Not available on this agent') }}"
          - "AWS CLI: {{ aws_check.stdout | default('Not available on this agent') }}"
