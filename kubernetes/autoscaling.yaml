@'
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: devops-capstone-app
  namespace: capstone
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: devops-capstone-app
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
'@ | Set-Content -Encoding utf8 .\kubernetes\autoscaling.yaml