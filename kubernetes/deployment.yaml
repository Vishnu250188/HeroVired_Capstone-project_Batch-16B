apiVersion: apps/v1
kind: Deployment

metadata:
  name: devops-capstone-app
  namespace: capstone
  labels:
    app: devops-capstone-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: devops-capstone-app

  template:
    metadata:
      labels:
        app: devops-capstone-app

    spec:
      containers:
        - name: web
          image: REPLACE_WITH_ECR_IMAGE_URI
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 5000
              protocol: TCP

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
